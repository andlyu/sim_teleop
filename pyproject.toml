[project]
name = "sim_teleop"
version = "0.1.0"
description = "Remote teleoperation of robotic arms in simulation (Genesis)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Physics engine. See README goals — evaluating Genesis as the sim backend.
    "genesis-world==1.0.0",
    # Genesis requires PyTorch but does not declare it as a dependency;
    # the default wheel ships Metal/MPS support on Apple Silicon.
    "torch==2.12.0",
]

[project.optional-dependencies]
# Mac-side MolmoAct2 client (talks to the remote GPU server). The server's own
# deps (torch+cuda, transformers, fastapi) live in molmoact2/server/requirements.txt
# and are installed on the Vast box, not here.
client = ["requests"]

[tool.uv]
# No package to build yet — this project is just an environment + scripts for now.
package = false
